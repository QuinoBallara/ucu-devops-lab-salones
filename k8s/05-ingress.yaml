apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salones
  namespace: alumno-team5
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  rules:
    - host: devops-salones-team5.reto-ucu.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
