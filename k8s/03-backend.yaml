apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: alumno-team5
  labels:
    app: salones
    component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: salones
      component: backend
  template:
    metadata:
      labels:
        app: salones
        component: backend
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: joaquinballara/salones-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /app/data/app.db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: salones-secrets
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: salones-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: salones-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: alumno-team5
spec:
  selector:
    app: salones
    component: backend
  ports:
    - port: 3000
      targetPort: 3000
